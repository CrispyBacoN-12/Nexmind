name: AI research round (daily)

# Automates kicking off the research loop (propose -> in-sample backtest ->
# auto-review) so nobody has to remember to run scripts/run-research-round.mts
# by hand. Rotates through src/lib/research/scheduledResearch.ts's fixed
# (symbol, mechanism angle) list, one entry per day.
#
# Deliberately once/day, not on the scan cadence (every 15 min): each round
# makes real Anthropic API calls (propose + up to 2 refinement rounds per
# candidate, cost-capped per candidate but not free), and new candidates still
# need a human to run scripts/approve-strategy.ts's blind test gate and port
# the code into strategies.ts by hand — this workflow only keeps the
# candidate pipeline fed, it does not deploy anything on its own.
#
# SCHEDULE DISABLED 2026-08-25 (owner's call: run locally until the system
# settles). Unlike swing-scan.yml this job does not run the loop itself — it
# curls the Vercel deployment, which has no ANTHROPIC_API_KEY and cannot host a
# `claude login` session. All 109 rounds it triggered cost $0 and produced the
# hardcoded mock candidates; since 08-25 those rounds bank as `skipped`
# instead, so the schedule would only manufacture empty runs.
#
# Local equivalent, same entry point, working CLI backend:
#   scripts/research-round.cmd   ->  node --env-file=.env --import tsx scripts/research-round.mts
#
# Re-enable by uncommenting the two `schedule` lines once Vercel actually has a
# credential. `workflow_dispatch` stays on for a manual run.
on:
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  research-round:
    runs-on: ubuntu-latest
    steps:
      - name: Call research cron endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXMIND_URL }}/api/cron/research"
