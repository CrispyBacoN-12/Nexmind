name: Swing scan (all desks)

# Vercel Hobby's native cron only runs once per day, but every swing desk
# (Gold, both BTC desks, Stocks) needs a 15-minute scan — same cadence as
# the old local bot.ts orchestrator (manage 5m / scan 15m). This workflow
# is the free substitute: it hits the deployed cron API route with no
# `ids` filter, so it scans every active swing portfolio automatically
# (and picks up any new desk without a workflow edit).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  scan-all:
    runs-on: ubuntu-latest
    steps:
      - name: Call scan cron endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXMIND_URL }}/api/cron/scan"

