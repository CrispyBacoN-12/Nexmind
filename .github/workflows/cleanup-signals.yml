name: Signal cleanup (weekly)

# Signal is the fastest-growing table (one row per scan tick, every 15 min on
# the BTC desks) and most rows never become a trade. Weekly is plenty for
# maintenance that isn't time-sensitive, unlike the scan/research crons.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch: {}

jobs:
  cleanup-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup cron endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXMIND_URL }}/api/cron/cleanup"
